name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: uvx ruff check skills tests
      - name: Tests
        run: uv run --all-extras pytest -q
      - name: Validate plugin manifest
        run: python -c "import json; [json.load(open(f)) for f in ('plugin.json', '.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"
