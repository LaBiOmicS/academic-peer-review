[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-peer-review"
version = "2.1.0"
description = "Academic Peer Review, FAIR Data & Scientific Integrity Plugin for Gemini and Antigravity (agy)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prof. Dr. Fabiano Bezerra Menegidio", email = "fabianomenegidio@umc.br" }
]
keywords = [
    "peer-review",
    "academic-publishing",
    "scientific-integrity",
    "gemini",
    "antigravity",
    "statcheck",
    "fair-data",
    "open-science",
    "scielo",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = []

[project.optional-dependencies]
stats = [
    "scipy>=1.10.0",
]
all = [
    "scipy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/LaBiOmicS/gemini-peer-review"
Repository = "https://github.com/LaBiOmicS/gemini-peer-review.git"
Issues = "https://github.com/LaBiOmicS/gemini-peer-review/issues"

[tool.hatch.build.targets.wheel]
packages = ["skills"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "scipy>=1.10.0",
]
