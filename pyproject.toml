[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "academic-peer-review"
version = "1.0.0"
description = "Multi-platform Academic Peer Review, FAIR Data & Scientific Integrity System for Gemini / Antigravity and Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prof. Dr. Fabiano Bezerra Menegidio", email = "fabianomenegidio@umc.br" }
]
keywords = [
    "peer-review",
    "academic-publishing",
    "scientific-integrity",
    "gemini",
    "antigravity",
    "statcheck",
    "fair-data",
    "open-science",
    "scielo",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = []

[project.optional-dependencies]
# Text extraction from PDF / DOCX manuscripts (pdftotext / pandoc are used as fallbacks).
extract = [
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
]
pdf = [
    "reportlab>=4.0.0",
]
all = [
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/LaBiOmicS/academic-peer-review"
Repository = "https://github.com/LaBiOmicS/academic-peer-review.git"
Issues = "https://github.com/LaBiOmicS/academic-peer-review/issues"

[tool.hatch.build.targets.wheel]
packages = ["skills"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    # Reference implementation used only by the tests to validate the pure-Python p-values.
    "scipy>=1.10.0",
    "reportlab>=4.0.0",
    # Hidden-content tests build PDFs/DOCX and scan them.
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 160
src = ["skills/paper-review/scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
